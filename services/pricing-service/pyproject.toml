[tool.poetry]
name = "hotel-key-pricing-service"
version = "0.1.0"
description = "Autonomous RL pricing engine"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
ray = {extras = ["rllib"], version = "^2.9.0"}
xgboost = "^2.0.3"
pandas = "^2.2.0"
numpy = "^1.26.0"
mlflow = "^2.12.2"
httpx = "^0.27.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
structlog = "^24.1.0"
apscheduler = "^3.10.4"
asyncpg = "^0.29.0"
gymnasium = "^0.29.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
