[tool.poetry]
name = "hotel-key-ml-service"
version = "0.1.0"
description = "Hotel Key ML prediction service"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.138.0"
starlette = "^1.3.1"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
xgboost = "^2.0.3"
scikit-learn = "^1.4.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
shap = "^0.45.0"
mlflow = "^2.12.2"
feast = "^0.38.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.2.0"
httpx = "^0.27.0"
structlog = "^24.1.0"
prometheus-client = "^0.20.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
opentelemetry-exporter-otlp = "^1.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
