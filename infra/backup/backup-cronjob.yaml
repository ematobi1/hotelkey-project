apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: hotel-key
spec:
  schedule: "0 2 * * *"    # 2am UTC daily
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              image: postgres:16-alpine
              command: ["/scripts/postgres-backup.sh"]
              envFrom:
                - secretRef:
                    name: postgres-backup-secrets
              volumeMounts:
                - name: backup-script
                  mountPath: /scripts
          restartPolicy: OnFailure
          volumes:
            - name: backup-script
              configMap:
                name: postgres-backup-script
                defaultMode: 0755
