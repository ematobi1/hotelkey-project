version: '3.8'

networks:
  fabric-network:
    name: fabric-network

volumes:
  orderer0-data:
  orderer1-data:
  orderer2-data:
  peer0-data:
  peer1-data:
  couchdb0-data:
  couchdb1-data:
  fabric-ca-data:

services:
  orderer0.hotel-key.internal:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer0.hotel-key.internal
    hostname: orderer0.hotel-key.internal
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8443
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - orderer0-data:/var/hyperledger/production/orderer
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer0.hotel-key.internal/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer0.hotel-key.internal/tls:/var/hyperledger/orderer/tls
      - ./channel-artifacts:/var/hyperledger/fabric/channel-artifacts
    ports:
      - 7050:7050
      - 7053:7053
      - 8443:8443
    networks:
      - fabric-network

  orderer1.hotel-key.internal:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer1.hotel-key.internal
    hostname: orderer1.hotel-key.internal
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8444
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - orderer1-data:/var/hyperledger/production/orderer
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer1.hotel-key.internal/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer1.hotel-key.internal/tls:/var/hyperledger/orderer/tls
      - ./channel-artifacts:/var/hyperledger/fabric/channel-artifacts
    ports:
      - 7051:7050
      - 7054:7053
      - 8444:8444
    networks:
      - fabric-network

  orderer2.hotel-key.internal:
    image: hyperledger/fabric-orderer:2.5
    container_name: orderer2.hotel-key.internal
    hostname: orderer2.hotel-key.internal
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
      - ORDERER_ADMIN_TLS_ENABLED=true
      - ORDERER_ADMIN_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_ADMIN_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_ADMIN_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_TLS_CLIENTROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_ADMIN_LISTENADDRESS=0.0.0.0:7053
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:8445
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - orderer2-data:/var/hyperledger/production/orderer
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer2.hotel-key.internal/msp:/var/hyperledger/orderer/msp
      - ./crypto-config/ordererOrganizations/orderer.hotel-key.internal/orderers/orderer2.hotel-key.internal/tls:/var/hyperledger/orderer/tls
      - ./channel-artifacts:/var/hyperledger/fabric/channel-artifacts
    ports:
      - 7052:7050
      - 7055:7053
      - 8445:8445
    networks:
      - fabric-network

  couchdb0:
    image: couchdb:3.2.1
    container_name: couchdb0
    hostname: couchdb0
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - couchdb0-data:/opt/couchdb/data
    ports:
      - 5984:5984
    networks:
      - fabric-network

  couchdb1:
    image: couchdb:3.2.1
    container_name: couchdb1
    hostname: couchdb1
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    volumes:
      - couchdb1-data:/opt/couchdb/data
    ports:
      - 5985:5984
    networks:
      - fabric-network

  peer0.hotel-key.internal:
    image: hyperledger/fabric-peer:2.5
    container_name: peer0.hotel-key.internal
    hostname: peer0.hotel-key.internal
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.hotel-key.internal
      - CORE_PEER_ADDRESS=peer0.hotel-key.internal:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hotel-key.internal:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.hotel-key.internal:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hotel-key.internal:7051
      - CORE_PEER_LOCALMSPID=HotelKeyMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - peer0-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hotel-key.internal/peers/peer0.hotel-key.internal/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hotel-key.internal/peers/peer0.hotel-key.internal/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8051:7051
      - 9444:9444
    depends_on:
      - couchdb0
    networks:
      - fabric-network

  peer1.hotel-key.internal:
    image: hyperledger/fabric-peer:2.5
    container_name: peer1.hotel-key.internal
    hostname: peer1.hotel-key.internal
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric-network
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer1.hotel-key.internal
      - CORE_PEER_ADDRESS=peer1.hotel-key.internal:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer1.hotel-key.internal:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hotel-key.internal:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.hotel-key.internal:7051
      - CORE_PEER_LOCALMSPID=HotelKeyMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - peer1-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/hotel-key.internal/peers/peer1.hotel-key.internal/msp:/etc/hyperledger/fabric/msp
      - ./crypto-config/peerOrganizations/hotel-key.internal/peers/peer1.hotel-key.internal/tls:/etc/hyperledger/fabric/tls
    ports:
      - 8052:7051
      - 9445:9445
    depends_on:
      - couchdb1
    networks:
      - fabric-network

  fabric-ca:
    image: hyperledger/fabric-ca:1.5
    container_name: fabric-ca
    hostname: fabric-ca.hotel-key.internal
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hotel-key
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
      - FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS=0.0.0.0:17054
    volumes:
      - fabric-ca-data:/etc/hyperledger/fabric-ca-server
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    ports:
      - 7054:7054
      - 17054:17054
    networks:
      - fabric-network
