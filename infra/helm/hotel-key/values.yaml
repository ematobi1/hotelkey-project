global:
  imageRegistry: ""
  imageTag: latest
  namespace: hotel-key

services:
  auth:
    name: auth-service
    port: 3001
    replicas: 2
    image: hotel-key/auth-service
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    hpa:
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilization: 70

  guest:
