apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ml-service-shadow
  namespace: hotel-key
spec:
  hosts:
    - ml-service
  http:
    - route:
        - destination:
            host: ml-service
            subset: primary
          weight: 100
      mirror:
        host: ml-service
        subset: shadow
      mirrorPercentage:
        value: 100.0
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: ml-service-shadow
  namespace: hotel-key
spec:
  host: ml-service
  subsets:
    - name: primary
      labels:
        model-version: primary
    - name: shadow
      labels:
        model-version: shadow
