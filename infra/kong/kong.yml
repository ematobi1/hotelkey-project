_format_version: "3.0"
_transform: true

# Global plugins — applied to all traffic through Kong
plugins:
  - name: rate-limiting
    config:
      minute: 100
      policy: local

  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid#counter
      echo_downstream: true

  - name: request-size-limiting
    config:
      allowed_payload_size: 10

services:
  # ---------------------------------------------------------------------------
  # auth-service  (port 3001)
  # JWT validation is handled by the service itself; Kong provides routing only
  # ---------------------------------------------------------------------------
  - name: auth-service
    url: http://host.docker.internal:3001
    routes:
      - name: auth-routes
        paths:
          - /v1/auth
        strip_path: false
        protocols:
          - http
          - https

  # ---------------------------------------------------------------------------
  # guest-service  (port 3002)
  # ---------------------------------------------------------------------------
