apiVersion: apps/v1
kind: Deployment
metadata:
  name: feast-server
  namespace: hotel-key
  labels:
    app: feast-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feast-server
  template:
    metadata:
      labels:
        app: feast-server
    spec:
      containers:
        - name: feast-server
          image: feastdev/feast:0.38.0
          command: ["feast", "serve", "--host", "0.0.0.0", "--port", "6566"]
          ports:
            - name: grpc
              containerPort: 6566
            - name: http
              containerPort: 8080
          env:
            - name: FEAST_USAGE
              value: "False"
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_DB
              value: hotel_key_analytics
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-secret
                  key: password
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: feast-repo
              mountPath: /feast/repo
      volumes:
        - name: feast-repo
          configMap:
            name: feast-repo-config
---
apiVersion: v1
kind: Service
metadata:
  name: feast
  namespace: hotel-key
  labels:
    app: feast-server
spec:
  type: ClusterIP
  selector:
    app: feast-server
  ports:
    - name: grpc
      port: 6566
      targetPort: 6566
    - name: http
      port: 8080
      targetPort: 8080
