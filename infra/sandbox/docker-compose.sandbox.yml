services:
  postgres-sandbox:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: hotel_key_sandbox
      POSTGRES_PASSWORD: sandbox_pass
      POSTGRES_DB: hotel_key
    ports:
      - '5433:5432'
    volumes:
      - postgres_sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hotel_key_sandbox']
      interval: 10s
      timeout: 5s
      retries: 5

  redis-sandbox:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis_sandbox_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-sandbox:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      CLUSTER_ID: 'SandboxClusterIdABCDE12345'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-sandbox:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka-sandbox:9092,CONTROLLER://kafka-sandbox:9093,EXTERNAL://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-sandbox:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - '9095:9095'
    volumes:
      - kafka_sandbox_data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics --bootstrap-server localhost:9095 --list']
      interval: 15s
      timeout: 10s
      retries: 10

  kong-sandbox:
    image: kong:3.6
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: '0.0.0.0:8000'
      KONG_ADMIN_LISTEN: '0.0.0.0:8001'
      KONG_LOG_LEVEL: warn
    ports:
      - '8000:8000'
      - '8001:8001'
    volumes:
      - ../../infra/kong/kong.yml:/kong/declarative/kong.yml:ro
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    image: timescale/timescaledb:latest-pg16
    depends_on:
      postgres-sandbox:
        condition: service_healthy
    environment:
      PGPASSWORD: sandbox_pass
    volumes:
      - ./seed.sql:/seed.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Running seed..." &&
        psql -h postgres-sandbox -U hotel_key_sandbox -d hotel_key -f /seed.sql &&
        echo "Seed complete."
    restart: 'no'

volumes:
  postgres_sandbox_data:
  redis_sandbox_data:
  kafka_sandbox_data:
