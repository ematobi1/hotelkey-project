services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    ports:
      - '8123:8123'  # HTTP
      - '9000:9000'  # Native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      CLICKHOUSE_DB: hotel_key_analytics
      CLICKHOUSE_USER: hotelkey
      CLICKHOUSE_PASSWORD: hotelkey_dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ['CMD-SHELL', 'clickhouse-client --query "SELECT 1"']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  clickhouse_data:
