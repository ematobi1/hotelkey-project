apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: notification-service
  namespace: hotel-key
spec:
  hosts:
    - notification-service
  gateways:
    - hotel-key-gateway
    - mesh
  http:
    - match:
        - uri:
            prefix: /v1/notifications
      route:
        - destination:
            host: notification-service
            port:
              number: 3007
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,reset,connect-failure"
