apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: billing-service
  namespace: hotel-key
spec:
  hosts:
    - billing-service
  gateways:
    - hotel-key-gateway
    - mesh
  http:
    - match:
        - uri:
            prefix: /v1/billing
      route:
        - destination:
            host: billing-service
            port:
              number: 3005
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,reset,connect-failure"
