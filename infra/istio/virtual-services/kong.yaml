apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kong
  namespace: hotel-key
spec:
  hosts:
    - kong
  gateways:
    - hotel-key-gateway
    - mesh
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kong
            port:
              number: 8000
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,reset,connect-failure"
