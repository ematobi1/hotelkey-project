apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: maintenance-service
  namespace: hotel-key
spec:
  hosts:
    - maintenance-service
  gateways:
    - hotel-key-gateway
    - mesh
  http:
    - match:
        - uri:
            prefix: /v1/maintenance
      route:
        - destination:
            host: maintenance-service
            port:
              number: 3009
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
        retryOn: "5xx,reset,connect-failure"
