apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: hotel-key
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
        version: v1
    spec:
      serviceAccountName: billing-service
      containers:
        - name: billing-service
          image: hotel-key/billing-service:latest
          ports:
            - containerPort: 3005
          envFrom:
            - secretRef:
                name: billing-service-secrets
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3005"
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      terminationGracePeriodSeconds: 30
