apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: hotel-key
spec:
  type: LoadBalancer
  selector:
    app: kong
  ports:
    - port: 80
      targetPort: 8000
      name: proxy
    - port: 443
      targetPort: 8443
      name: proxy-ssl
    - port: 8001
      targetPort: 8001
      name: admin
