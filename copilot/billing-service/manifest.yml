name: billing-service
type: Load Balanced Web Service

http:
  path: '/v1/billing'
  healthcheck:
    path: '/health'
    healthy_threshold: 2
    unhealthy_threshold: 3
    interval: 30s
    timeout: 5s

image:
  build:
    dockerfile: services/billing-service/Dockerfile
    context: .
  port: 3005

cpu: 256
memory: 512
count: 1
exec: true
network:
  connect: true

variables:
  NODE_ENV: production
  PORT: 3005
  HOST: 0.0.0.0
  DATABASE_URL: postgresql://hotelkey:HotelKey2026!@hotel-key-demo.c0zq8ks60dxz.us-east-1.rds.amazonaws.com:5432/hotel_key_billing?sslmode=no-verify
  KAFKA_BROKERS: localhost:9092
  JWT_PUBLIC_KEY_BASE64: dGVtcC1wdWJsaWMta2V5LWZvci1kZW1v
  STRIPE_SECRET_KEY: sk_test_demo_placeholder
  STRIPE_WEBHOOK_SECRET: whsec_demo_placeholder
  LOG_LEVEL: info

environments:
  demo:
    count: 1
    deployment:
      rolling: 'recreate'
