name: booking-engine-service
type: Load Balanced Web Service

http:
  path: '/v1/booking-engine'
  healthcheck:
    path: '/health'
    healthy_threshold: 2
    unhealthy_threshold: 3
    interval: 30s
    timeout: 5s

image:
  build:
    dockerfile: services/booking-engine-service/Dockerfile
    context: .
  port: 3017

cpu: 256
memory: 512
count: 1
exec: true
network:
  connect: true

variables:
  NODE_ENV: production
  PORT: "3017"
  HOST: 0.0.0.0
  LOG_LEVEL: info
  CART_TTL_SECONDS: "900"
  PENDING_PAYMENT_TTL_SECONDS: "1800"
  RATE_LIMIT_MAX: "30"
  REDIS_URL: redis://localhost:6379
  KAFKA_BROKERS: localhost:9092
  STRIPE_SECRET_KEY: sk_test_demo_placeholder
  RESERVATION_SERVICE_URL: http://hotel--Publi-67crryVktJSd-2116934759.us-east-1.elb.amazonaws.com
  ROOM_SERVICE_URL: http://hotel--Publi-67crryVktJSd-2116934759.us-east-1.elb.amazonaws.com
  BILLING_SERVICE_URL: http://hotel--Publi-67crryVktJSd-2116934759.us-east-1.elb.amazonaws.com
  GUEST_SERVICE_URL: http://hotel--Publi-67crryVktJSd-2116934759.us-east-1.elb.amazonaws.com

environments:
  demo:
    count: 1
    deployment:
      rolling: 'recreate'
